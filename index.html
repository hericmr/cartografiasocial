webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}.noscript-content{padding:20px;max-width:800px;margin:0 auto}.noscript-content h1{color:#1a1a1a;margin-bottom:20px}.noscript-content img{max-width:100%;height:auto;margin:20px 0;border-radius:8px}.noscript-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}.noscript-gallery img{width:100%;height:150px;object-fit:cover;border-radius:4px}</style><script defer="defer" src="/cartografiasocial/static/js/main.c52c8750.js"></script><link href="/cartografiasocial/static/css/main.ccbcc747.css" rel="stylesheet"></head><body><noscript>Você precisa ativar o JavaScript para visualizar este aplicativo.<div class="noscript-content"><h1>Cartografia Social de Santos</h1><div><p>Esta é uma <strong>cartografia social</strong> que busca mapear territorialidades, lutas e conquistas dos movimentos sociais e da população na cidade de Santos. O mapa destaca a presença de equipamentos sociais, culturais, religiosos, políticos, educacionais, como escolas, unidades de saúde, assistência social, espaços culturais e de lazer, além de comunidades e locais carregados de memória e história.</p><br><h2>Os pontos estão representados por:</h2><ul><li><strong>🎯 Lazer</strong>: equipamentos sociais, culturais e de lazer</li><li><strong>🏥 Assistência</strong>: unidades de assistência social e saúde</li><li><strong>🏛️ Históricos</strong>: lugares históricos e de memória</li><li><strong>🏘️ Comunidades</strong>: territórios de comunidades</li><li><strong>🎓 Educação</strong>: escolas e unidades de ensino</li><li><strong>⛪ Religião</strong>: estabelecimentos religiosos</li></ul><br><h2>Histórias mapeadas:</h2><p>Entre os elementos mapeados, estão histórias relacionadas à <strong>escravidão e lutas do povo negro</strong>, à <strong>opressão e resistência à ditadura empresarial-militar (1964-1984)</strong>, e às <strong>lutas que moldaram e continuam moldando a identidade da região</strong>.</p><br><h2>Sobre os materiais:</h2><p>Os materiais cartográficos e textuais disponíveis aqui foram produzidos pelas(os) <strong>estudantes de Serviço Social da UNIFESP</strong> do vespertino e noturno durante a <strong>Unidade Curricular de Política Social 2</strong>, em <strong>2024 e 2025</strong>.</p><br><h2>Galeria de Imagens:</h2><div class="noscript-gallery"><img src="/cartografiasocial/fotos/turma.png" alt="Turma de estudantes"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG_20251021_162955.jpg" alt="Cartografia Social 1"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG_20251021_163006.jpg" alt="Cartografia Social 2"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG_20251021_163037.jpg" alt="Cartografia Social 3"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG_20251021_163051.jpg" alt="Cartografia Social 4"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG-20251021-WA0081.jpeg" alt="Cartografia Social 5"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG-20251021-WA0083.jpeg" alt="Cartografia Social 6"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG-20251021-WA0085.jpeg" alt="Cartografia Social 7"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG-20251021-WA0087.jpeg" alt="Cartografia Social 8"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG-20251021-WA0089.jpeg" alt="Cartografia Social 9"/> <img src="/cartografiasocial/fotos/cartografiasocial-1-001/cartografiasocial/IMG-20251021-WA0091.jpeg" alt="Cartografia Social 10"/></div></div></div></noscript><div id="root"><div class="loading"><div class="loading-spinner"></div></div></div><script>window.addEventListener("load",(function(){const e=document.querySelector(".loading");e&&(e.style.opacity="0",e.style.transit
